<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kel's Homelab Status</title>
  <style>
    :root{--bg:#080b12;--card:#111827;--border:#263858;--text:#e2e8f4;--muted:#8490aa;--teal:#00d4a0;--green:#22c55e;--amber:#f59e0b;--red:#ef4444}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#132954 0,transparent 34%),radial-gradient(circle at 85% 80%,#063d38 0,transparent 28%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(980px,calc(100% - 32px));margin:0 auto;padding:48px 0 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:36px}.eyebrow{font:11px ui-monospace,SFMono-Regular,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}h1{margin:7px 0 8px;font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.04em}p{color:var(--muted);margin:0}.monitor{border:1px solid var(--border);border-radius:999px;padding:9px 14px;font:12px ui-monospace,SFMono-Regular,monospace;white-space:nowrap}.monitor.ok{color:var(--green);border-color:#166534;background:#092d20}.monitor.warn{color:var(--amber);border-color:#854d0e;background:#2d1d08}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.service{background:linear-gradient(145deg,#172035,#0e1525);border:1px solid var(--border);border-radius:14px;padding:20px;transition:.2s}.service:hover{transform:translateY(-3px);border-color:#3b82f6;box-shadow:0 12px 35px #0008}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.name{font-size:18px;font-weight:700}.url{display:block;margin-top:7px;color:var(--muted);font:11px ui-monospace,SFMono-Regular,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font:11px ui-monospace,SFMono-Regular,monospace;padding:4px 9px;border-radius:99px}.up{color:var(--green);background:#14532d}.down{color:var(--red);background:#450a0a}.unknown{color:var(--amber);background:#451a03}.detail{margin-top:17px;color:var(--muted);font:11px ui-monospace,SFMono-Regular,monospace}.foot{margin-top:28px;color:var(--muted);font:12px ui-monospace,SFMono-Regular,monospace;text-align:center}
    .section{margin-top:30px}.section-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}.section-head:after{content:"";height:1px;background:linear-gradient(90deg,var(--border),transparent);flex:1}.section-title{font:11px ui-monospace,SFMono-Regular,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}.section-note{font:11px ui-monospace,SFMono-Regular,monospace;color:var(--muted)}.local-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.device{min-height:148px}.device .detail{line-height:1.7}.metric{margin-top:14px;font-size:26px;font-weight:800;letter-spacing:-.04em;color:var(--teal)}.submetric{margin-top:4px;color:var(--muted);font:11px ui-monospace,SFMono-Regular,monospace}.local-summary{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 0 14px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#0d1524;color:var(--muted);font:11px ui-monospace,SFMono-Regular,monospace}.local-summary strong{color:var(--text);font-weight:600}.local-summary .stale{color:var(--amber)}.local-summary .fresh{color:var(--green)}.empty{grid-column:1/-1;color:var(--muted);font:12px ui-monospace,SFMono-Regular,monospace;padding:22px;border:1px dashed var(--border);border-radius:14px}
    @media(max-width:800px){.local-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){main{padding-top:28px}.top{align-items:flex-start;flex-direction:column}.grid,.local-grid{grid-template-columns:1fr}.monitor{white-space:normal}}
  </style>
</head>
<body>
  <main>
    <section class="top">
      <div><div class="eyebrow">External homelab monitor</div><h1>Kel's Homelab Status</h1><p>This page and its checker live outside the house.</p></div>
      <div id="monitor" class="monitor unknown">Loading checks…</div>
    </section>
    <section class="section"><div class="section-head"><div class="section-title">Public services</div><div class="section-note">GitHub Actions</div></div><section id="services" class="grid"><article class="service"><div class="name">Loading…</div></article></section></section>
    <section class="section"><div class="section-head"><div class="section-title">Home infrastructure</div><div id="local-note" class="section-note">Docker collector</div></div><div id="local-summary" class="local-summary">Waiting for the local collector…</div><section id="local-services" class="grid local-grid"><article class="empty">Waiting for local-status.json.</article></section></section>
    <div id="foot" class="foot">Waiting for the first external check.</div>
  </main>
  <script>
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function age(iso){if(!iso||iso.startsWith('1970-'))return 'not reported';const m=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));return m<1?'just now':m===1?'1 minute ago':`${m} minutes ago`}
    function stale(iso,minutes=15){return !iso||iso.startsWith('1970-')||Date.now()-new Date(iso).getTime()>minutes*60000}
    async function getJson(path){const r=await fetch(`${path}?_=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`${path} ${r.status}`);return r.json()}
    function serviceCards(items){return (items||[]).map(s=>{const protectedEndpoint=s.http_code===401||s.http_code===403;const badge=s.up?(protectedEndpoint?'REACHABLE':'ONLINE'):'OFFLINE';const detail=s.up?`${s.http_code} response · ${s.latency_ms} ms · ${esc(s.status_text||'HTTP endpoint responded')}`:(esc(s.error)||'No response');return `<article class="service"><div class="row"><div class="name">${esc(s.name)}</div><span class="badge ${s.up?'up':'down'}">${badge}</span></div><a class="url" href="${esc(s.url)}">${esc(s.url)}</a><div class="detail">${esc(s.description||'External HTTPS check')}<br>${detail}</div></article>`}).join('')||'<article class="empty">No external services are configured.</article>'}
    function localCards(d,isStale){
      const hosts=(d.hosts||[]).map(h=>{const check=h.check?`check: ${h.check}`:'reachability check';const latency=h.latency_ms==null?'—':`${h.latency_ms} ms`;const detail=h.up?(h.description||'Responding from the Docker VM'):`No response from the Docker VM · ${h.description||'reachability check failed'}`;return `<article class="service device"><div class="row"><div class="name">${esc(h.name)}</div><span class="badge ${h.up?'up':'down'}">${h.up?'ONLINE':'OFFLINE'}</span></div><div class="metric">${esc(h.address||'—')}</div><div class="submetric">${latency} · ${esc(check)}</div><div class="detail">${esc(detail)}${isStale?' · last report may be stale':''}</div></article>`}).join('');
      const n=d.nest||{};const nestValue=n.available&&n.temperature!=null?`${esc(n.temperature)} ${esc(n.unit||'°C')}`:'N/A';const nestDetail=n.available?'Temperature is available through Home Assistant':(n.message||'Nest data unavailable');
      const nest=`<article class="service device"><div class="row"><div class="name">Nest indoor temperature</div><span class="badge ${n.available&&!isStale?'up':'unknown'}">${n.available&&!isStale?'AVAILABLE':n.configured?'CHECK':'SETUP'}</span></div><div class="metric">${nestValue}</div><div class="submetric">Home Assistant state: ${esc(n.state||'unknown')}</div><div class="detail">${esc(nestDetail)}</div></article>`;
      return hosts+nest||'<article class="empty">The local collector has not reported yet.</article>';
    }
    async function load(){
      const monitor=document.querySelector('#monitor'),services=document.querySelector('#services'),localServices=document.querySelector('#local-services'),summary=document.querySelector('#local-summary'),localNote=document.querySelector('#local-note'),foot=document.querySelector('#foot');
      let external=null,local=null;
      try{external=await getJson('status.json');services.innerHTML=serviceCards(external.services)}catch(e){services.innerHTML='<article class="empty">External status data could not be loaded.</article>'}
      try{local=await getJson('local-status.json')}catch(e){local=null}
      const externalStale=!external||stale(external.generated_at),localStale=!local||stale(local.generated_at),externalUp=external&&!externalStale&&external.overall==='up',homeUp=local&&!localStale&&local.overall==='up';
      monitor.className=`monitor ${externalUp&&homeUp?'ok':externalUp||homeUp?'warn':'bad'}`;monitor.textContent=externalStale?'EXTERNAL CHECKER STALE':localStale?'HOME REPORT STALE':externalUp&&homeUp?'ALL SYSTEMS OPERATIONAL':'ATTENTION REQUIRED';
      if(local){const collector=local.collector?.name||'Docker VM';summary.innerHTML=`<strong class="${localStale?'stale':'fresh'}">${localStale?'STALE':'LIVE'} · ${esc(collector)}</strong><span>Last home report: ${esc(age(local.generated_at))}</span><span>Home summary: ${local.overall==='up'?'all reachable':'one or more checks failed'}</span>`;localNote.textContent=localStale?'last report is stale':'updated from home';localServices.innerHTML=localCards(local,localStale)}else{summary.innerHTML='<strong class="stale">NOT REPORTING</strong><span>The Docker-side collector has not published local-status.json yet.</span>';localNote.textContent='waiting for setup';localServices.innerHTML='<article class="empty">Upload local-status.json once, then run the Docker-side collector every few minutes.</article>'}
      foot.textContent=`Last external check: ${external?age(external.generated_at):'not available'} · Last home report: ${local?age(local.generated_at):'not available'} · GitHub Pages`;
    }
    load();setInterval(load,60000);
  </script>
</body>
</html>
